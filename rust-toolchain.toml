# The toolchain every stable build uses, locally and in CI (whose jobs run
# `rustup toolchain install`, which reads this file). Bumping it is a pull
# request of its own that fixes any new lints. The minimum supported Rust is
# `rust-version` in Cargo.toml, checked by CI's msrv job; the miri job names
# its nightly explicitly, which overrides this file.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
