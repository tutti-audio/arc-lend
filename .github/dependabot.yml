# Monthly dependency updates, one pull request per ecosystem for patch
# releases. The Rust toolchain (rust-toolchain.toml) is bumped by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [patch]
    # The comparison harness pins its contenders exactly, so a re-run
    # measures the same code; a contender moves by hand, with a new run.
    ignore:
      - dependency-name: arc-swap
      - dependency-name: basedrop
      - dependency-name: left-right
      - dependency-name: crossbeam-epoch
      - dependency-name: haphazard
      - dependency-name: triple_buffer
      - dependency-name: core_affinity
      - dependency-name: hdrhistogram
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 1
