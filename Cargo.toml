[package]
name = "arc-lend"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "A shared-value cell for threads on a deadline: one thread replaces the value while others read it without waiting or freeing"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tutti-audio/arc-lend"
documentation = "https://docs.rs/arc-lend"
readme = "README.md"
keywords = ["arc", "realtime", "lock-free", "wait-free", "hazard-pointer"]
categories = ["concurrency", "data-structures", "memory-management"]
# The comparison harness and the repository's own setup are not part of the
# published crate.
exclude = ["/compare", "/.github", "/rust-toolchain.toml"]

[lints]
workspace = true

# No dependencies. Under `--cfg loom` the cell's atomics, fences and mutex
# become loom's, so `tests/loom.rs` checks the shipped protocol rather than a
# replica of it. Only that flag pulls loom in; a normal build never sees it.
#
#     LOOM_MAX_PREEMPTIONS=4 RUSTFLAGS="--cfg loom" cargo test --release --test loom
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
# The baseline in `benches/lend.rs`: the bench measures a lend against an
# `ArcSwap` `load()`, the read it most often stands in for. Nothing in `src/`
# uses it.
arc-swap = "1.7"
# `tests/no_alloc.rs`: the reader's code path runs inside an allocation gate.
assert_no_alloc = { version = "1", default-features = false }
criterion = "0.8"

[[bench]]
name = "lend"
harness = false

# The crate and its comparison harness (`compare/`, never published).
[workspace]
members = ["compare"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

# `cfg(loom)` is set from the command line (`RUSTFLAGS="--cfg loom"`) to run
# the loom models; `cfg(docsrs)` is set by docs.rs.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(docsrs)'] }
missing_docs = "warn"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
